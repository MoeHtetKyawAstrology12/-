<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>လောကီပညာ စာအုပ်စင်</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
    background: #f4f1ea;
    color: #2c2c2c;
    padding-bottom: 40px;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, #6b3e1e, #b8860b);
    color: #fff;
    padding: 32px 20px 26px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  }
  header h1 {
    font-size: 1.65rem;
    margin-bottom: 8px;
    line-height: 1.6;
    text-shadow: 0 2px 4px rgba(0,0,0,0.25);
  }
  header p {
    font-size: 0.95rem;
    opacity: 0.92;
  }

  /* ===== Search ===== */
  .search-wrap {
    max-width: 700px;
    margin: 22px auto 0;
    display: flex;
    gap: 10px;
    padding: 0 15px;
    flex-wrap: wrap;
  }
  .search-wrap input {
    flex: 1;
    min-width: 200px;
    padding: 13px 18px;
    border: none;
    border-radius: 30px;
    font-size: 1rem;
    outline: none;
    box-shadow: 0 3px 8px rgba(0,0,0,0.18);
    font-family: inherit;
  }
  .search-wrap button {
    padding: 13px 24px;
    border: none;
    background: #2c2c2c;
    color: #fff;
    border-radius: 30px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.95rem;
    transition: 0.2s;
  }
  .search-wrap button:hover { background: #000; }

  /* ===== Container ===== */
  .container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 15px;
  }

  /* ===== Grid — 5 ကွက် × 4 တန်း = 20 ===== */
  .book-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 22px;
  }

  @media (max-width: 1100px) {
    .book-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 850px) {
    .book-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    .book-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }

  /* ===== Book Card ===== */
  .book-card {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .book-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
  }

  /* ===== CSS Book Cover (ပုံမလိုဘဲ ဖန်တီး) ===== */
  .book-cover {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px 12px;
    color: #fff;
    overflow: hidden;
    background: linear-gradient(135deg, var(--c1, #6b3e1e), var(--c2, #b8860b));
  }

  /* စာအုပ်ကျောရိုး (spine) */
  .book-cover::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 12px;
    background: rgba(0,0,0,0.28);
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.25);
    z-index: 1;
  }

  /* စာအုပ်အလင်းပြန်မှု (glossy shine) */
  .book-cover::after {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(120deg,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0.18) 50%,
      rgba(255,255,255,0) 60%);
    pointer-events: none;
    z-index: 1;
  }

  /* အလှဆင် ဘောင်လိုင်း */
  .cover-frame {
    position: absolute;
    inset: 22px 12px 22px 22px;
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 3px;
    pointer-events: none;
    z-index: 2;
  }

  .cover-top {
    position: relative;
    z-index: 3;
    text-align: center;
    font-size: 0.62rem;
    letter-spacing: 1.5px;
    opacity: 0.9;
    margin-top: 4px;
  }

  .cover-title {
    position: relative;
    z-index: 3;
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.45;
    padding: 0 6px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cover-author {
    position: relative;
    z-index: 3;
    text-align: center;
    font-size: 0.68rem;
    opacity: 0.92;
    margin-bottom: 4px;
    font-style: italic;
  }

  /* ===== Book Info ===== */
  .book-info {
    padding: 11px 12px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .book-title {
    font-size: 0.92rem;
    font-weight: 700;
    color: #2c2c2c;
    line-height: 1.4;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .book-author {
    font-size: 0.8rem;
    color: #7a7a7a;
    margin-bottom: 6px;
  }
  .book-price {
    font-size: 0.95rem;
    color: #b8860b;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .buy-btn {
    margin-top: auto;
    text-align: center;
    background: linear-gradient(135deg, #25d366, #128c7e);
    color: #fff;
    padding: 9px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 600;
    transition: 0.2s;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .buy-btn:hover { opacity: 0.9; }

  /* ===== No result ===== */
  .no-result {
    text-align: center;
    color: #888;
    padding: 60px 20px;
    font-size: 1rem;
    display: none;
  }

  /* ===== Modal ===== */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 14px;
    max-width: 400px;
    width: 100%;
    padding: 26px 22px;
    text-align: center;
    animation: pop 0.25s ease;
  }
  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-box h3 {
    font-size: 1.05rem;
    margin-bottom: 6px;
    color: #2c2c2c;
    line-height: 1.5;
  }
  .modal-box p {
    font-size: 0.88rem;
    color: #666;
    margin-bottom: 18px;
  }
  .contact-btn {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    color: #fff;
    transition: 0.2s;
  }
  .contact-btn:hover { opacity: 0.88; }
  .viber { background: #7360f2; }
  .telegram { background: #229ed9; }
  .close-btn {
    margin-top: 6px;
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
    padding: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>🙏 မင်္ဂလာပါ</h1>
  <p>လောကီပညာ စာအုပ်စင်မှ ကြိုဆိုပါတယ်</p>
</header>

<div class="search-wrap">
  <input type="text" id="searchInput"
         placeholder="🔍 စာအုပ်အမည် / စာရေးဆရာ အမည်ဖြင့် ရှာပါ...">
  <button onclick="renderBooks()">ရှာမည်</button>
</div>

<div class="container">
  <div class="book-grid" id="bookGrid"></div>
  <div class="no-result" id="noResult">
    😔 ရှာဖွေမှုနှင့် ကိုက်ညီသော စာအုပ် မတွေ့ပါ။
  </div>
</div>

<!-- Contact Modal -->
<div class="modal" id="contactModal">
  <div class="modal-box">
    <h3 id="modalBookTitle">စာအုပ်ဝယ်ယူရန်</h3>
    <p>အောက်ပါ နည်းလမ်းများဖြင့် ဆက်သွယ်ဝယ်ယူနိုင်ပါတယ်</p>

    <a class="contact-btn viber" id="viberLink" href="#">
      ☎️ Viber: 09699459935
    </a>
    <a class="contact-btn telegram" id="telegramLink" href="#">
      🆔 Telegram: @moehtetkyaw9799
    </a>

    <button class="close-btn" onclick="closeModal()">ပိတ်မည်</button>
  </div>
</div>

<script>
let allBooks = [];

async function loadBooks() {
  try {
    const res = await fetch('list.json');
    allBooks = await res.json();
    renderBooks();
  } catch (err) {
    console.error('list.json ဖတ်မရပါ:', err);
    document.getElementById('noResult').textContent =
      '⚠️ list.json ဖိုင်ကို ဖတ်မရပါ။ ဖိုင် ရှိမရှိ စစ်ပါ။';
    document.getElementById('noResult').style.display = 'block';
  }
}

function renderBooks() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('bookGrid');
  const noResult = document.getElementById('noResult');

  const filtered = allBooks.filter(b =>
    (b.title  || '').toLowerCase().includes(keyword) ||
    (b.author || '').toLowerCase().includes(keyword)
  );

  grid.innerHTML = '';

  if (filtered.length === 0) {
    noResult.textContent = '😔 ရှာဖွေမှုနှင့် ကိုက်ညီသော စာအုပ် မတွေ့ပါ။';
    noResult.style.display = 'block';
    return;
  }
  noResult.style.display = 'none';

  filtered.forEach((book) => {
    const c1 = book.color1 || '#6b3e1e';
    const c2 = book.color2 || '#b8860b';

    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      <div class="book-cover" style="--c1:${c1}; --c2:${c2};">
        <div class="cover-frame"></div>
        <div class="cover-top">လောကီပညာ</div>
        <div class="cover-title">${book.title}</div>
        <div class="cover-author">— ${book.author} —</div>
      </div>
      <div class="book-info">
        <div class="book-title">${book.title}</div>
        <div class="book-author">✍️ ${book.author}</div>
        <div class="book-price">💰 ${formatPrice(book.price)} ကျပ်</div>
        <button class="buy-btn" onclick="openModal('${escapeQuote(book.title)}')">
          🛒 ဝယ်မည်
        </button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function formatPrice(p) {
  return Number(p || 0).toLocaleString('en-US');
}

function escapeQuote(str) {
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function openModal(title) {
  document.getElementById('modalBookTitle').textContent = `📖 "${title}" ဝယ်ယူရန်`;

  const msg = encodeURIComponent(`မင်္ဂလာပါ၊ "${title}" စာအုပ် ဝယ်ချင်ပါတယ်။`);

  document.getElementById('viberLink').href    = 'viber://chat?number=%2B959699459935';
  document.getElementById('telegramLink').href = `https://t.me/moehtetkyaw9799?text=${msg}`;

  document.getElementById('contactModal').classList.add('show');
}

function closeModal() {
  document.getElementById('contactModal').classList.remove('show');
}

document.getElementById('contactModal').addEventListener('click', e => {
  if (e.target.id === 'contactModal') closeModal();
});

document.getElementById('searchInput').addEventListener('input', renderBooks);

loadBooks();
</script>

</body>
  </html>
