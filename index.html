<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>လောကီပညာ စာအုပ်စင်</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
    background: #fdf4f8;
    color: #2c2c2c;
    padding-bottom: 40px;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, #c2185b 0%, #e91e63 45%, #f06292 100%);
    color: #fff;
    padding: 34px 20px 28px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(194, 24, 91, 0.35);
  }
  header h1 {
    font-size: 1.7rem;
    margin-bottom: 8px;
    line-height: 1.6;
    text-shadow: 0 2px 6px rgba(0,0,0,0.28);
  }
  header p { font-size: 0.95rem; opacity: 0.95; }

  /* ===== Search ===== */
  .search-wrap {
    max-width: 700px;
    margin: 22px auto 0;
    display: flex;
    gap: 10px;
    padding: 0 15px;
    flex-wrap: wrap;
  }
  .search-wrap input {
    flex: 1;
    min-width: 200px;
    padding: 13px 18px;
    border: none;
    border-radius: 30px;
    font-size: 1rem;
    outline: none;
    box-shadow: 0 3px 10px rgba(194,24,91,0.18);
    font-family: inherit;
  }
  .search-wrap button {
    padding: 13px 24px;
    border: none;
    background: #c2185b;
    color: #fff;
    border-radius: 30px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.95rem;
    transition: 0.2s;
    box-shadow: 0 3px 10px rgba(194,24,91,0.28);
  }
  .search-wrap button:hover { background: #8e0e42; }

  /* ===== Container ===== */
  .container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 15px;
  }

  /* ===== Grid — ၄ တန်း × ၅ အုပ် = 20 ===== */
  .book-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  @media (max-width: 950px) {
    .book-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
  }
  @media (max-width: 620px) {
    .book-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }

  /* ===== Book Card ===== */
  .book-card {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(194,24,91,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .book-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 26px rgba(194,24,91,0.22);
  }

  /* ===== Book Cover ===== */
  .book-cover {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 12px;
    color: #fff;
    overflow: hidden;
    background: linear-gradient(135deg, var(--c1, #6b3e1e), var(--c2, #b8860b));
  }
  .book-cover::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 12px;
    background: rgba(0,0,0,0.28);
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.25);
    z-index: 1;
  }
  .book-cover::after {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(120deg,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0.16) 50%,
      rgba(255,255,255,0) 60%);
    pointer-events: none;
    z-index: 1;
  }

  /* ===== ကနုတ်ဘောင် ===== */
  .kanote-frame {
    position: absolute;
    inset: 10px 10px 10px 18px;
    border: 1.5px solid rgba(255, 235, 200, 0.85);
    border-radius: 4px;
    pointer-events: none;
    z-index: 2;
  }
  .kanote-frame::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(255, 235, 200, 0.55);
    border-radius: 2px;
  }
  .kanote-corner {
    position: absolute;
    width: 22px; height: 22px;
    border: 1.5px solid rgba(255, 235, 200, 0.9);
    z-index: 3;
    pointer-events: none;
  }
  .kanote-corner.tl { top: 6px; left: 14px; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
  .kanote-corner.tr { top: 6px; right: 6px; border-left: none; border-bottom: none; border-top-right-radius: 12px; }
  .kanote-corner.bl { bottom: 6px; left: 14px; border-right: none; border-top: none; border-bottom-left-radius: 12px; }
  .kanote-corner.br { bottom: 6px; right: 6px; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

  .kanote-dot {
    position: absolute;
    width: 5px; height: 5px;
    background: rgba(255, 235, 200, 0.95);
    border-radius: 50%;
    z-index: 3;
  }
  .kanote-dot.tl { top: 4px; left: 12px; }
  .kanote-dot.tr { top: 4px; right: 4px; }
  .kanote-dot.bl { bottom: 4px; left: 12px; }
  .kanote-dot.br { bottom: 4px; right: 4px; }

  .cover-top {
    position: relative;
    z-index: 4;
    text-align: center;
    font-size: 0.62rem;
    letter-spacing: 1.5px;
    opacity: 0.95;
    margin-top: 6px;
  }
  .cover-title {
    position: relative;
    z-index: 4;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.45;
    padding: 0 10px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.55);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .cover-author {
    position: relative;
    z-index: 4;
    text-align: center;
    font-size: 0.7rem;
    opacity: 0.95;
    margin-bottom: 6px;
    font-style: italic;
  }

  /* ===== Book Info ===== */
  .book-info {
    padding: 12px 14px 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .book-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: #2c2c2c;
    line-height: 1.4;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .book-author {
    font-size: 0.82rem;
    color: #7a7a7a;
    margin-bottom: 6px;
  }
  .book-price {
    font-size: 1rem;
    color: #c2185b;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .buy-btn {
    margin-top: auto;
    text-align: center;
    background: linear-gradient(135deg, #c2185b, #f06292);
    color: #fff;
    padding: 10px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: 0.2s;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .buy-btn:hover { opacity: 0.9; }

  /* ===== No result ===== */
  .no-result {
    text-align: center;
    color: #888;
    padding: 60px 20px;
    font-size: 1rem;
    display: none;
  }

  /* ===== Modal ===== */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 14px;
    max-width: 430px;
    width: 100%;
    padding: 26px 22px;
    text-align: center;
    animation: pop 0.25s ease;
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-box h3 {
    font-size: 1.05rem;
    margin-bottom: 14px;
    color: #c2185b;
    line-height: 1.5;
  }
  .book-summary {
    background: #fdf4f8;
    border-left: 3px solid #e91e63;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 16px;
    text-align: left;
    font-size: 0.88rem;
    line-height: 1.7;
  }
  .book-summary .lbl { color: #999; display: inline-block; min-width: 90px; }
  .book-summary .val { color: #2c2c2c; font-weight: 600; }

  .modal-box p {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 14px;
  }
  .contact-btn {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    color: #fff;
    transition: 0.2s;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
  }
  .contact-btn:hover { opacity: 0.9; }
  .viber { background: #7360f2; }
  .telegram { background: #229ed9; }
  .close-btn {
    margin-top: 6px;
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
    padding: 8px;
  }

  /* ===== Toast Notification ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #2c2c2c;
    color: #fff;
    padding: 14px 22px;
    border-radius: 30px;
    font-size: 0.9rem;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    z-index: 200;
    max-width: 90%;
    text-align: center;
    line-height: 1.5;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<header>
  <h1>🙏 မင်္ဂလာပါ</h1>
  <p>လောကီပညာ စာအုပ်စင်မှ ကြိုဆိုပါတယ်</p>
</header>

<div class="search-wrap">
  <input type="text" id="searchInput"
         placeholder="🔍 စာအုပ်အမည် / စာရေးဆရာ အမည်ဖြင့် ရှာပါ...">
  <button onclick="renderBooks()">ရှာမည်</button>
</div>

<div class="container">
  <div class="book-grid" id="bookGrid"></div>
  <div class="no-result" id="noResult">
    😔 ရှာဖွေမှုနှင့် ကိုက်ညီသော စာအုပ် မတွေ့ပါ။
  </div>
</div>

<!-- Contact Modal -->
<div class="modal" id="contactModal">
  <div class="modal-box">
    <h3>📖 စာအုပ်ဝယ်ယူရန်</h3>

    <div class="book-summary" id="bookSummary"></div>

    <p>အောက်ပါ နည်းလမ်းများဖြင့် ဆက်သွယ်ဝယ်ယူနိုင်ပါတယ်</p>

    <button class="contact-btn viber" id="viberBtn">
      ☎️ Viber: 09699459935
    </button>
    <a class="contact-btn telegram" id="telegramLink" href="#" target="_blank">
      🆔 Telegram: @moehtetkyaw9799
    </a>

    <button class="close-btn" onclick="closeModal()">ပိတ်မည်</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const VIBER_NUMBER = '09699459935';
const VIBER_NUMBER_INTL = '959699459935';   // + မပါဘဲ
const TELEGRAM_USER = 'moehtetkyaw9799';

let allBooks = [];
let currentBook = null;

/* ===== Data load ===== */
async function loadBooks() {
  try {
    const res = await fetch('list.json');
    allBooks = await res.json();
    renderBooks();
  } catch (err) {
    console.error('list.json ဖတ်မရပါ:', err);
    document.getElementById('noResult').textContent =
      '⚠️ list.json ဖိုင်ကို ဖတ်မရပါ။ ဖိုင် ရှိမရှိ စစ်ပါ။';
    document.getElementById('noResult').style.display = 'block';
  }
}

/* ===== Render books ===== */
function renderBooks() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('bookGrid');
  const noResult = document.getElementById('noResult');

  const filtered = allBooks.filter(b =>
    (b.title  || '').toLowerCase().includes(keyword) ||
    (b.author || '').toLowerCase().includes(keyword)
  );

  grid.innerHTML = '';

  if (filtered.length === 0) {
    noResult.textContent = '😔 ရှာဖွေမှုနှင့် ကိုက်ညီသော စာအုပ် မတွေ့ပါ။';
    noResult.style.display = 'block';
    return;
  }
  noResult.style.display = 'none';

  filtered.forEach((book, idx) => {
    const c1 = book.color1 || '#6b3e1e';
    const c2 = book.color2 || '#b8860b';

    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      <div class="book-cover" style="--c1:${c1}; --c2:${c2};">
        <div class="kanote-frame"></div>
        <span class="kanote-corner tl"></span>
        <span class="kanote-corner tr"></span>
        <span class="kanote-corner bl"></span>
        <span class="kanote-corner br"></span>
        <span class="kanote-dot tl"></span>
        <span class="kanote-dot tr"></span>
        <span class="kanote-dot bl"></span>
        <span class="kanote-dot br"></span>
        <div class="cover-top">❖ လောကီပညာ ❖</div>
        <div class="cover-title">${book.title}</div>
        <div class="cover-author">— ${book.author} —</div>
      </div>
      <div class="book-info">
        <div class="book-title">${book.title}</div>
        <div class="book-author">✍️ ${book.author}</div>
        <div class="book-price">💰 ${formatPrice(book.price)} ကျပ်</div>
        <button class="buy-btn" data-idx="${idx}">
          🛒 ဝယ်မည်
        </button>
      </div>
    `;
    // index ကို ပြန်ရှာဖို့ data attribute သုံး (အမည်ထဲမှာ quote ရှိလည်း ပြဿနာမရှိ)
    const btn = card.querySelector('.buy-btn');
    btn.addEventListener('click', () => openModal(book));
    grid.appendChild(card);
  });
}

function formatPrice(p) {
  return Number(p || 0).toLocaleString('en-US');
}

/* ===== Modal ===== */
function openModal(book) {
  currentBook = book;

  // စာအုပ်အချက်အလက် summary
  document.getElementById('bookSummary').innerHTML = `
    <div><span class="lbl">📕 စာအုပ်</span>: <span class="val">${book.title}</span></div>
    <div><span class="lbl">✍️ စာရေးဆရာ</span>: <span class="val">${book.author}</span></div>
    <div><span class="lbl">💰 ဈေးနှုန်း</span>: <span class="val">${formatPrice(book.price)} ကျပ်</span></div>
  `;

  // Telegram — chat box မှာ စာအုပ်အချက်အလက် အော်တို ဖြည့်
  const msg = buildOrderMessage(book);
  document.getElementById('telegramLink').href =
    `https://t.me/${TELEGRAM_USER}?text=${encodeURIComponent(msg)}`;

  document.getElementById('contactModal').classList.add('show');
}

function closeModal() {
  document.getElementById('contactModal').classList.remove('show');
}

document.getElementById('contactModal').addEventListener('click', e => {
  if (e.target.id === 'contactModal') closeModal();
});

/* ===== Order message (Telegram auto-fill အတွက်) ===== */
function buildOrderMessage(book) {
  return `မင်္ဂလာပါ၊ ကျွန်တော်/ကျွန်မ ဒီစာအုပ် ဝယ်ချင်ပါတယ်:\n\n` +
         `📕 စာအုပ်: ${book.title}\n` +
         `✍️ စာရေးဆရာ: ${book.author}\n` +
         `💰 ဈေးနှုန်း: ${formatPrice(book.price)} ကျပ်`;
}

/* ===== Viber Button — Fallback + Copy ===== */
document.getElementById('viberBtn').addEventListener('click', async () => {
  if (!currentBook) return;

  const msg = buildOrderMessage(currentBook);
  const viberAppURL = `viber://chat?number=%2B${VIBER_NUMBER_INTL}&text=${encodeURIComponent(msg)}`;

  // ၁။ Message ကို clipboard ကို ကြိုတင် copy (fallback အတွက်)
  try {
    await navigator.clipboard.writeText(msg);
  } catch (e) {
    copyFallback(msg);
  }

  // ၂။ Viber app ဖွင့်ကြည့်
  let appOpened = false;
  const startTime = Date.now();

  const onVisibilityChange = () => {
    if (document.hidden) appOpened = true;
  };
  document.addEventListener('visibilitychange', onVisibilityChange);

  // Viber app URL ကို ဖွင့်
  try {
    window.location.href = viberAppURL;
  } catch (e) {
    appOpened = false;
  }

  // ၃။ ၁.၅ စက္ကန့် အကြာမှာ app မဖွင့်ရင် fallback
  setTimeout(async () => {
    document.removeEventListener('visibilitychange', onVisibilityChange);

    if (!appOpened && !document.hidden) {
      // နံပါတ်ကို clipboard ကို copy
      try {
        await navigator.clipboard.writeText(VIBER_NUMBER);
        showToast(
          `📋 Viber မဖွင့်နိုင်ပါ။ ဖုန်းနံပါတ် "${VIBER_NUMBER}" ကို copy ပြီးပါပြီ။ Viber ကို ဖွင့်ပြီး paste လုပ်ကာ ဆက်သွယ်ပါ။`
        );
      } catch (e) {
        // clipboard API မရရင် manual copy dialog
        fallbackCopyDialog(VIBER_NUMBER);
      }

      // Viber web ကို ကြိုးစား (optional)
      // window.open('https://invite.viber.com/?number=' + VIBER_NUMBER_INTL, '_blank');
    } else {
      showToast('✅ Viber ကို ဖွင့်နေပါပြီ...');
    }
  }, 1500);
});

/* ===== Copy fallback (execCommand) ===== */
function copyFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

/* ===== Manual copy dialog (clipboard API မရရင်) ===== */
function fallbackCopyDialog(text) {
  const userInput = prompt(
    `Viber မဖွင့်နိုင်ပါ။ အောက်ပါနံပါတ်ကို ကိုယ်တိုင် copy လုပ်ပါ:\n\n${text}\n\n(OK နှိပ်ပြီး Ctrl+C ဖြင့် copy လုပ်နိုင်ပါတယ်)`,
    text
  );
  if (userInput) {
    copyFallback(text);
    showToast(`📋 "${text}" ကို copy ပြီးပါပြီ`);
  }
}

/* ===== Toast ===== */
let toastTimer;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 4000);
}

/* ===== Events ===== */
document.getElementById('searchInput').addEventListener('input', renderBooks);

loadBooks();
</script>

</body>
</html>
